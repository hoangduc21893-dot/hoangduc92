name: Daily Trading Engine DS1

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ds1-daily-scan
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore signal history
        uses: actions/cache@v4
        with:
          path: data/signal_history.jsonl
          key: signal-history-${{ github.run_id }}
          restore-keys: signal-history-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate and extract Trading Engine package
        env:
          PACKAGE_PATH: trading-engine-s1-s5-ds1-risk-upgraded.zip
        run: |
          test -s "$PACKAGE_PATH"
          unzip -tq "$PACKAGE_PATH"
          rm -rf engine
          mkdir -p engine
          unzip -oq "$PACKAGE_PATH" -d engine
          test -s engine/main.py
          test -s engine/requirements.txt
          test -s engine/test_risk_engine.py

      - name: Install dependencies
        run: python -m pip install -r engine/requirements.txt

      - name: Run focused risk-engine tests
        working-directory: engine
        run: python -m unittest test_risk_engine.py

      - name: Run Trading Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine/main.py

      - name: Save signal history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-history-${{ github.run_id }}
          path: data/signal_history.jsonl
          if-no-files-found: ignore
          retention-days: 90
