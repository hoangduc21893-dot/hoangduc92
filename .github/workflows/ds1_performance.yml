name: DS1 DNSE Performance Collector
on:
  push:
    paths: ['scripts/ds1_performance.py', 'scripts/ds1_universe.py', 'test_ds1_universe.py', 'test_ds1_performance.py', '.github/workflows/ds1_performance.yml']
  pull_request:
    paths: ['scripts/ds1_performance.py', 'scripts/ds1_universe.py', 'test_ds1_universe.py', 'test_ds1_performance.py', '.github/workflows/ds1_performance.yml']
  schedule:
    - cron: '45 9 * * 1-5' # 16:45 ICT (UTC+7); holiday gate below
  workflow_dispatch:
    inputs:
      date:
        description: 'Session YYYY-MM-DD; blank = latest completed'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ds1-performance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  performance:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DS1_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests tzdata
      - name: Unit and DS2 regression tests
        run: python -m unittest -v test_ds1_performance test_ds2_eod test_ds1_universe
      - name: Historical live integration (read only)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python -m scripts.ds1_performance --date 2026-10-16 --output work/ds1-smoke
      - name: Scheduled trading session gate
        id: gate
        if: github.event_name == 'schedule'
        run: |
          python -c "from scripts import ds2_eod as d; from datetime import datetime; import os; open(os.environ['GITHUB_OUTPUT'], 'a').write('trading=' + str(d.trading_day(datetime.now(d.ICT).date())).lower() + '\n')"
      - name: Collect completed performance
        id: collect
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && steps.gate.outputs.trading == 'true')
        env:
          REPORT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$REPORT_DATE" ]; then
            python -m scripts.ds1_performance --date "$REPORT_DATE"
          else
            python -m scripts.ds1_performance
          fi
      - name: Commit report only on main
        if: steps.collect.outcome == 'success' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ds1_performance/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: collect validated DS1 closing prices'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            # Rebase unrelated concurrent main updates; never force or resolve report conflicts blindly.
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo '::error::Concurrent report conflict: preserved in artifact; manual review required'
              exit 1
            fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Job summary
        if: always()
        run: |
          find data/ds1_performance work/ds1-smoke -maxdepth 1 -name 'report*.md' -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds1-performance-${{ github.run_id }}
          path: |
            data/ds1_performance/
            work/ds1-smoke/
          if-no-files-found: warn
          retention-days: 90
