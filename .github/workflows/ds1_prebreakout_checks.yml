name: DS1 Pre-Breakout Checks

on:
  push:
    branches:
      - codex/prebreakout-scanner
  pull_request:
    paths:
      - "scripts/ds1_watch.py"
      - "scripts/ds1_prebreakout.py"
      - "scripts/test_ds1_prebreakout.py"
      - ".github/workflows/ds1_prebreakout_checks.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: python -m py_compile scripts/ds1_watch.py scripts/ds1_prebreakout.py scripts/test_ds1_prebreakout.py
      - run: python -m unittest discover -s scripts -p "test_ds1_prebreakout.py" -v
