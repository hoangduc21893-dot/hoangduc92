name: DS1 Market-Wide v2 Paper Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ds1_market_wide.py'
      - 'scripts/ds1_watch.py'
      - 'test_ds1_market_wide.py'
      - 'scripts/ds1_eod_report.py'
      - 'test_ds1_eod_report.py'
      - '.github/workflows/ds1_dnse_eod.yml'
      - '.github/workflows/ds1_market_wide.yml'
  workflow_dispatch:
  # GitHub cron uses UTC; 02:20/06:10 UTC = 09:20/13:10 ICT.
  # Scheduled workflows execute only from the repository default branch.
  schedule:
    - cron: '20 2 * * 1-5'
    - cron: '10 6 * * 1-5'

permissions:
  contents: read

concurrency:
  group: ds1-market-wide-v2-paper
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests tzdata
      - name: Offline regression tests
        run: python -m unittest -v test_ds1_market_wide test_ds1_snapshot test_ds1_eod_report
      - name: DNSE EOD 08 Oct 2026 baseline validation (PR only; no Telegram)
        if: github.event_name == 'pull_request'
        id: eod
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        run: python -m scripts.ds1_eod_report --date 2026-10-08
      - name: Upload DNSE EOD 08 Oct CSV and JSON
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ds1-dnse-eod-2026-10-08-${{ github.run_id }}
          path: data/ds1_eod/
          if-no-files-found: warn
          retention-days: 90
      - name: Restore daily data cache
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/cache@v4
        with:
          path: data/ds1_v2/daily_cache.json
          key: ds1-v2-daily-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ds1-v2-daily-
      - name: Market-wide paper scan (no Telegram)
        env:
          DS1_V2_VALIDATED: 'false'
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        if: github.event_name == 'workflow_dispatch'
        run: python -m scripts.ds1_market_wide --mode paper
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds1-v2-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/ds1_v2/
          if-no-files-found: ignore
          retention-days: 90

