name: DS1 Market-Wide v2 Paper Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ds1_market_wide.py'
      - 'scripts/ds1_watch.py'
      - 'test_ds1_market_wide.py'
      - '.github/workflows/ds1_market_wide.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ds1-market-wide-v2-paper
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests tzdata
      - name: Offline regression tests
        run: python -m unittest -v test_ds1_market_wide test_ds1_snapshot
      - name: Restore daily data cache
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: data/ds1_v2/daily_cache.json
          key: ds1-v2-daily-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ds1-v2-daily-
      - name: Market-wide paper scan (no Telegram)
        if: github.event_name == 'workflow_dispatch'
        run: python -m scripts.ds1_market_wide --mode paper
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds1-v2-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/ds1_v2/
          if-no-files-found: ignore
          retention-days: 90

