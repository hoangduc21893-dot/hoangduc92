name: VN30F1M Payload Probe

on:
  push:
    paths:
      - "scripts/vn30f1m_payload_probe.py"
      - ".github/workflows/vn30f1m_payload_probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run payload probe
        run: python scripts/vn30f1m_payload_probe.py
        env:
          PROBE_DURATION_SEC: "60"
          PROBE_INTERVAL_SEC: "10"
          PROBE_LOOKBACK_SEC: "86400"
      - name: Upload raw probe
        uses: actions/upload-artifact@v4
        with:
          name: vn30f1m-payload-probe
          path: data/vn30f1m_payload_probe.jsonl
          if-no-files-found: error
