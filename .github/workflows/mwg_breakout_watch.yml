name: DS1 Conservative Watch

on:
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

concurrency:
  group: ds1-conservative-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore DS1 signal history and state
        uses: actions/cache@v4
        with:
          path: |
            data/signal_history.jsonl
            data/ds1_watch_state.json
          key: ds1-history-${{ github.run_id }}
          restore-keys: ds1-history-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run DS1 conservative watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ds1_watch.py

      - name: Save DS1 signal history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds1-signal-history-${{ github.run_id }}
          path: data/signal_history.jsonl
          if-no-files-found: ignore
          retention-days: 90
