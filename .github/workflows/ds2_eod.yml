name: DS2 DNSE closed EOD
on:
  push:
    paths: ['scripts/ds2_eod.py', 'test_ds2_eod.py', '.github/workflows/ds2_eod.yml']
  pull_request:
    paths: ['scripts/ds2_eod.py', 'test_ds2_eod.py', '.github/workflows/ds2_eod.yml']
  schedule:
    - cron: '10 9 * * 1-5' # 16:10 ICT; runtime exchange holiday gate
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ds2-eod-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ds2-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests tzdata
      - name: Regression tests
        run: python -m unittest -v test_ds2_eod
      - name: DNSE historical smoke (code changes only)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python -m scripts.ds2_eod --date 2026-10-15
      - name: Current session closed EOD
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m scripts.ds2_eod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds2-eod-${{ github.run_id }}
          path: data/ds2/
          if-no-files-found: error
          retention-days: 90
