name: KBS OI Adapter v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/kbs_oi_adapter_v1.py'
      - 'scripts/test_kbs_oi_adapter_v1.py'
      - '.github/workflows/kbs_oi_adapter.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Unit tests
        run: python -m unittest -v scripts/test_kbs_oi_adapter_v1.py
      - name: Live KBS OI snapshot
        run: python scripts/kbs_oi_adapter_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: kbs-oi-adapter-v1
          path: data/kbs_oi_snapshot.json
          retention-days: 30
