name: VN30F1M Futures Watch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/vn30f1m_watch.py'
      - 'scripts/kbs_oi_adapter_v1.py'
      - 'test_vn30f1m_oi_integration.py'
      - 'test_kbs_oi_adapter_v1.py'
      - '.github/workflows/vn30f1m_watch.yml'
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

concurrency:
  group: vn30f1m-futures-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests
      - name: Validate KBS OI integration
        run: python -m unittest -v test_kbs_oi_adapter_v1.py test_vn30f1m_oi_integration.py
      - name: Live KBS OI snapshot
        run: python scripts/kbs_oi_adapter_v1.py
      - name: Run VN30F1M Futures Engine
        if: ${{ github.event_name != 'push' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/vn30f1m_watch.py
      - name: Save futures signal history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vn30f1m-signal-history-${{ github.run_id }}
          path: |
            data/vn30f1m_signal_history.jsonl
            data/kbs_oi_snapshot.json
          if-no-files-found: ignore
          retention-days: 90
